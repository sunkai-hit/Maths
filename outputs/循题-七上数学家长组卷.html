</style></head><body><header><div class="brand"><span class="mark">△</span><strong>循题</strong><span>家长备课台</span></div><div class="edition">鲁教版 · 五四制 · 七年级上册</div><button id="open-paper" class="primary">我的练习卷 <b id="cart-count">0</b></button></header><div class="layout"><aside id="nav"><p class="eyebrow">教材目录</p><h2>数学 · 七年级上册</h2><div id="chapters"></div><div class="aside-note">按内容拆分建议课时<br>学习进度与难度由家长选择</div></aside><main id="main"><div class="breadcrumb">数学七上 / 第一章 三角形 / 认识三角形</div><div class="title-row"><div><p class="eyebrow">CHAPTER 01</p><h1>认识三角形</h1><p class="muted">从知识点出发，沿着题型逐步深入。</p></div><span class="chapter-symbol">△</span></div><section class="guide"><div><span class="pill">建议课时 1</span><h2>三边关系与三角形判定</h2><p>任意两边之和大于第三边。已知两边 a、b，第三边 c 满足 |a−b| &lt; c &lt; a+b。</p></div><button id="example-button">查看例题讲解 ↗</button></section><section class="bank"><div class="section-heading"><h2>同类题练习</h2><span class="muted">先理解例题，再选择练习</span></div><div id="filters"><button class="filter active">全部难度</button><button class="filter">基础题</button><button class="filter">提高题</button><button class="filter">压轴题</button></div><div id="questions"><article class="question"><div class="q-meta"><span class="pill">基础题</span><span>选择题 · 三边关系</span></div><p>下列各组线段长度中，能组成三角形的是（　）。</p><div class="options">A. 2，3，5　　B. 3，4，5　　C. 1，2，4　　D. 2，2，4</div><div class="q-bottom"><button>查看解析</button><button class="pick">＋ 加入练习卷</button></div></article></div></section></main></div><dialog id="detail"></dialog><dialog id="paper"></dialog><div id="toast" role="status" aria-live="polite"></div><div id="print-root"></div><script>
/* 原创同步例题与练习。章节依据用户提供的目录，建议课时按内容组织。 */
const curriculum=[
 {name:'三角形',sections:['认识三角形','图形的全等','探索三角形全等的条件','三角形的尺规作图','利用三角形全等测距离']},
 {name:'轴对称',sections:['轴对称现象','探索轴对称的性质','简单的轴对称图形','利用轴对称进行设计']},
 {name:'勾股定理',sections:['探索勾股定理','一定是直角三角形吗','勾股定理的应用举例']},
 {name:'实数',sections:['无理数','平方根','立方根','估算','用计算器开方','实数']},
 {name:'位置与坐标',sections:['确定位置','平面直角坐标系','轴对称与坐标变化']},
 {name:'一次函数',sections:['函数','一次函数','一次函数的图象','确定一次函数的表达式','一次函数的应用']}
];
const topics=[];
const Q=(type,text,answer,steps,options=[],diagram=null)=>({type,text,answer,steps,options,diagram});
function T(section,name,rule,method,pitfall,example,basic,improve,challenge){const id='t'+String(topics.length+1).padStart(2,'0');const [chapter,part]=section.split('.').map(Number);const questions=[basic,improve,challenge].map((q,i)=>({...q,id:id+'-'+(i+1),difficulty:['基础题','提高题','压轴题'][i],topicId:id,chapter,section}));topics.push({id,section,chapter,part,name,rule,method,pitfall,example,questions});}
T('1.1','三边关系与第三边范围','两边为 a、b 时，第三边 c 满足 |a−b|＜c＜a+b。','先求严格范围，再结合整数、周长或等腰条件筛选。','两端不能取等号；等腰条件需区分底边和腰。',
Q('解答题','三角形两边长为 4 和 7，第三边 x 为整数，求 x 的所有可能值。','4，5，6，7，8，9，10',['由三边关系，3＜x＜11。','整数 x=4，5，6，7，8，9，10，共 7 个。']),
Q('选择题','下列各组线段长度中，能组成三角形的是（　）。','B',['比较较小两边之和与最大边。A、D 恰好相等，C 的和小于最大边，均不能组成三角形。','B 中 3+4＞5，能组成三角形。'],['2，3，5','3，4，5','1，2，4','2，2，4']),
Q('填空题','三角形两边长为 5、8，第三边为偶数，则第三边共有____种可能。','5',['由三边关系，3＜x＜13。','满足条件的偶数为 4、6、8、10、12，共 5 个。']),
Q('解答题','等腰三角形周长为 20，其中一边长为 6。求所有可能的三边长。','6，6，8 或 7，7，6',['当 6 为腰时，底边为 20−12=8，6+6＞8，成立。','当 6 为底边时，两腰各为 (20−6)÷2=7，成立。','所以有两种可能。']));
T('1.1','内角和、外角与角平分线','内角和为 180°；外角等于与它不相邻的两个内角的和。','明确角所在的三角形，再列等式；角平分线对应一半角度。','外角关系不包含相邻内角。',
Q('计算题','△ABC 中，∠A=48°，∠B=67°，求 ∠C。','65°',['三角形内角和为 180°。','∠C=180°−48°−67°=65°。']),
Q('选择题','一个三角形的两个内角为 35°、75°，第三个内角为（　）。','C',['第三角=180°−35°−75°=70°。'],['60°','65°','70°','110°']),
Q('计算题','△ABC 中，∠A=2∠B，C 点处的外角为 120°，求三个内角。','∠A=80°，∠B=40°，∠C=60°',['设 ∠B=x，由外角性质得 2x+x=120°，x=40°。','∠A=80°；∠C=180°−120°=60°。']),
Q('证明题','△ABC 的内角平分线 BD、CE 相交于内部点 I。若 ∠A=50°，求 ∠BIC 并说明理由。','115°',['∠ABC+∠ACB=130°。','角平分线给出 ∠IBC+∠ICB=65°。','在 △BIC 中，∠BIC=180°−65°=115°。']));
T('1.1','中线、高与面积分割','中线连接顶点与对边中点；高是顶点到对边所在直线的垂线段。','面积比较先找同高或同底关系，用底边比转化为面积比。','高可能在三角形外；中线通常不是高。',

Q('解答题','直角三角形两边长为 3、5，求第三边。','4 或 √34',['若 5 为斜边，第三边=√(25−9)=4。','若 3、5 都为直角边，第三边=√(9+25)=√34。','3 不可能是斜边，因为已有更长边 5。']),
Q('选择题','直角三角形中，两直角边均为 1，斜边为（　）。','B',['斜边平方=1+1=2，斜边为 √2。'],['1','√2','2','√3']),
Q('计算题','等腰三角形腰为 13，底边为 10，求底边上的高和面积。','高 12，面积 60',['高平分底边，半底长为 5。','高 h=√(13²−5²)=12。','面积=10×12÷2=60。']),
Q('解答题','△ABC 中 AB=13、AC=15、BC=14。高 AD 的垂足 D 在线段 BC 上。求 BD、AD 和面积。','BD=5，AD=12，面积 84',['设 BD=x，DC=14−x，高为 h。','由勾股定理，x²+h²=169，(14−x)²+h²=225。','相减得 196−28x=56，x=5，h²=169−25=144，所以 h=12。','面积=14×12÷2=84。']));
T('3.2','勾股定理的逆定理','若三边中最长边 c 满足 a²+b²=c²，则三角形为直角三角形。','先确定最大边，计算两小边平方和，再与最大边平方比较。','必须用最大边检验，边长关系不能写成两边和等于第三边。',

Q('解答题','△ABC 三边满足 a∶b∶c=5∶12∶13，周长为 60。判断形状并求面积。','直角三角形，面积 120',['比例总份数为 30，比例系数为 60÷30=2，三边为 10、24、26。','10²+24²=26²，所以是直角三角形。','面积=10×24÷2=120。']),
Q('解答题','三条线段长为 n、n+1、n+2，其中 n 为正整数。若能组成直角三角形，求 n。','n=3',['最大边为 n+2，故 n²+(n+1)²=(n+2)²。','化简得 n²−2n−3=0，即 (n−3)(n+1)=0。','n 为正整数，得 n=3；3、4、5 满足三边关系。']));

Q('填空题','长 13 米的梯子靠墙，梯脚距墙 5 米，则梯顶离地____米。','12',['高度平方=169−25=144，所以高度为 12 米。']),
Q('解答题','一根 10 米长的杆折断后，杆顶触地处距底端 4 米。折断点距地面多高？','4.2 米',['设高度为 x，则折下部分长 10−x，为斜边。','x²+4²=(10−x)²，得 16=100−20x。','x=4.2，折下部分为 5.8 米，符合题意。']),
Q('解答题','长 10 米的梯子，初始梯脚离墙 6 米；梯脚向外移动 2 米后，梯顶下降多少米？','2 米',['初始高度=√(100−36)=8 米。','移动后梯脚距墙 8 米，高度=√(100−64)=6 米。','下降高度=8−6=2 米。本题恰好与水平移动相同，但一般不相同。']));

Q('解答题','长方体长、宽、高为 6、3、2，求沿表面从一个顶点到与其相对顶点的最短距离。比较三种相邻面展开方案。','√61',['将两种边合并为展开面的宽，有三种候选距离。','分别为 √((6+3)²+2²)=√85，√((6+2)²+3²)=√73，√((3+2)²+6²)=√61。','三种路线都能沿相邻表面实现，最小为 √61。']));

Q('证明题','AB、CD 相交于 O，OA=OB、OC=OD。证明 AC∥BD。','AC∥BD',['两边及对顶角相等，△AOC≌△BOD（SAS）。','所以 ∠OAC=∠OBD，这是一组内错角，故 AC∥BD。']),
Q('证明题','△ABC 中 AB=AC，D、E 分别在 AB、AC 上且 BD=CE，BE、CD 交于 O。证明 OB=OC。','OB=OC',['AD=AB−BD，AE=AC−CE，所以 AD=AE。','△ABE≌△ACD（SAS），故 ∠ABE=∠ACD。','由 AB=AC 得 ∠ABC=∠ACB，两边分别减去相等的角，得 ∠OBC=∠OCB。','△OBC 等角对等边，故 OB=OC。']));
T('2.0','轴对称单元综合','将轴对称、线段垂直平分线、角平分线与等腰性质结合。','先把图形对称关系转化为等边或等角，再推理。','等距对象要分清端点与直线。',
Q('解答题','等腰 △ABC 中 AB=AC=10，D 是 BC 中点，BC=12。说明 AD 为什么是对称轴所在直线。','直线 AD 垂直平分 BC，并交换 B、C',['由等腰三角形性质，AD 垂直且平分 BC。','A 在轴上不动，B、C 互为对称点，因此两侧三角形完全重合。']),

Q('证明题','△ABC 中 AB=AC，D 是 BC 中点。P 在线段 AD 上，过 P 分别作 PM⊥AB、PN⊥AC。证明 PM=PN 且 BM=CN。','PM=PN，BM=CN',['AD 平分 ∠BAC，所以 PM=PN。','Rt△APM 与 Rt△APN 斜边 AP 公共、直角边 PM=PN，由 HL 全等，故 AM=AN。','P 在线段 AD 上，垂足 M、N 位于边 AB、AC 上；因此 BM=AB−AM=AC−AN=CN。']));
T('3.0','勾股定理单元综合','结合三边判断、作高分割、面积与实际距离。','确定直角关系，再列平方关系；用面积找到不同高之间的联系。','求出的边长、时间、距离应满足实际范围。',
Q('解答题','直角三角形两直角边为 9、12，求斜边及斜边上的高。','斜边 15，高 36/5',['斜边=√(81+144)=15。','面积=9×12÷2=54；也等于 15h÷2。','因此 h=108/15=36/5。']),

Q('计算题','A(−3,2)、B(3,2)，O 为原点，求 △OAB 面积，并判断 A、B 关于哪条轴对称。','面积 6；关于 y 轴对称',['AB 长为 6，O 到直线 y=2 的距离为 2，面积=6×2÷2=6。','A、B 横坐标互为相反数、纵坐标相等，关于 y 轴对称。']),
Q('解答题','A(−2,3)，B 为 A 关于 y 轴的对称点，C 为 A 关于 x 轴的对称点。求 △ABC 面积及 BC。','面积 12，BC=2√13',['B=(2,3)，C=(−2,−3)。','AB=4，AC=6，AB⊥AC，所以面积=4×6÷2=12。','BC=√(4²+6²)=√52=2√13。']));
T('6.0','一次函数单元综合','贯通待定系数、交点、面积、方案选择与取值范围。','先建立表达式，再以交点或端点作为分界进行讨论。','实际条件与数学范围必须同时满足。',
Q('解答题','一次函数经过 (0,4)、(2,0)，求表达式及图象与两坐标轴围成的面积。','y=−2x+4，面积 4',['由 (0,4) 得 b=4；由 (2,0) 得 2k+4=0，k=−2。','两坐标轴截距长度为 2、4，面积为 2×4÷2=4。']),
Q('填空题','y=2x−4 的图象与 x 轴交于____。','(2,0)',['令 y=0，2x−4=0，x=2。']),
Q('解答题','两家租车方案分别为 y₁=100+20x、y₂=40x（x 为正整数小时）。比较何时哪家便宜。','1～4 小时选第二家；5 小时同价；6 小时起选第一家',['相等时 100+20x=40x，x=5。','差 y₁−y₂=100−20x，小于 5 时为正，大于 5 时为负。','结合正整数小时得所述范围。']),

function drawDiagram(d){
 const w=320,h=220,pad=28,points=d.points||{},lines=d.lines||[],bounds=d.bounds||[-1,9,-1,7];
 const [xmin,xmax,ymin,ymax]=bounds,scale=Math.min((w-2*pad)/(xmax-xmin),(h-2*pad)/(ymax-ymin)),ox=(w-scale*(xmax-xmin))/2,oy=(h-scale*(ymax-ymin))/2;
 const xy=p=>[ox+(p[0]-xmin)*scale,h-oy-(p[1]-ymin)*scale];
 const line=(a,b,cls='')=>{const [x1,y1]=xy(a),[x2,y2]=xy(b);return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}"/>`;};
 let svg='';if(d.axes){for(let x=Math.ceil(xmin);x<=xmax;x++)svg+=line([x,ymin],[x,ymax],'grid');for(let y=Math.ceil(ymin);y<=ymax;y++)svg+=line([xmin,y],[xmax,y],'grid');svg+=line([xmin,0],[xmax,0],'axis')+line([0,ymin],[0,ymax],'axis');const [xx,xyy]=xy([xmax,0]),[yx,yy]=xy([0,ymax]);svg+=`<text x="${xx-6}" y="${xyy-8}">x</text><text x="${yx+8}" y="${yy+5}">y</text>`;}
 for(const [a,b] of lines)svg+=line(points[a],points[b]);
 if(d.graph){for(const g of d.graph){svg+=line([g[2],g[0]*g[2]+g[1]],[g[3],g[0]*g[3]+g[1]],'graph');}}
 for(const [name,p] of Object.entries(points)){const [x,y]=xy(p);svg+=`<circle cx="${x}" cy="${y}" r="3"/><text x="${x+(p[2]||7)}" y="${y+(p[3]||-9)}">${name}</text>`;}
 return `<figure class="math-figure"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${d.label||'题目几何示意图'}">${svg}</svg><figcaption>${d.axes?'每小格 1 个单位':'示意图，长度以题目条件为准'}</figcaption></figure>`;
}

function setPicked(ids,selected){if(!Array.isArray(ids)||ids.some(id=>!byId.has(id)))throw Error('题目编号无效');state.cart=selected?[...new Set([...state.cart,...ids])]:state.cart.filter(id=>!ids.includes(id));save();renderCount();renderQuestions();}
function showDialog(selector,html){const dialog=$(selector);dialog.innerHTML=html;if(!dialog.open)dialog.showModal();}
const dialogHead=(title,subtitle='')=>`<div class="dialog-head"><div><h2>${esc(title)}</h2>${subtitle?`<p class="muted">${esc(subtitle)}</p>`:''}</div><button data-act="close" aria-label="关闭">×</button></div>`;
function solutionHTML(q){return `<div class="solution"><strong>答案：${esc(q.answer)}</strong><ol>${q.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`;}
function showExample(id){const t=byTopic.get(id);showDialog('#detail',dialogHead(t.name,'知识梳理 → 例题讲解 → 分层练习')+`<div class="knowledge"><h3>知识要点</h3><p>${esc(t.rule)}</p><h3>解题方法</h3><p>${esc(t.method)}</p><div class="pitfall"><strong>易错提醒</strong> ${esc(t.pitfall)}</div></div><div class="example"><span class="pill">讲解例题 · ${t.example.type}</span><p>${esc(t.example.text)}</p>${diagramHTML(t.example)}${optionsHTML(t.example)}${solutionHTML(t.example)}</div><div class="dialog-actions"><button class="primary" data-act="practice" data-id="${id}">进入本题型练习</button></div>`);}
function showAnswer(id){const q=byId.get(id);showDialog('#detail',dialogHead('答案与解析',`${q.id.toUpperCase()} · ${byTopic.get(q.topicId).name}`)+`<p>${esc(q.text)}</p>${diagramHTML(q)}${optionsHTML(q)}${solutionHTML(q)}<div class="pitfall"><strong>方法提示</strong> ${esc(byTopic.get(q.topicId).method)}</div>`);}
function showCoverage(){showDialog('#detail',dialogHead('全册题型目录',`${topics.length} 个题型，每个含 1 道例题、3 道分层练习`)+`<div class="coverage">${curriculum.map((c,i)=>`<h3>第${'一二三四五六'[i]}章 ${c.name}</h3>${[...c.sections,'单元复习'].map((s,j)=>{const key=`${i+1}.${j===c.sections.length?0:j+1}`;return `<details><summary>${j===c.sections.length?'复习':j+1} ${esc(s)} <span>${topics.filter(t=>t.section===key).length} 个题型</span></summary><ul>${topics.filter(t=>t.section===key).map(t=>`<li><button class="text-button" data-act="coverage-topic" data-id="${t.id}">${esc(t.name)} ↗</button></li>`).join('')}</ul></details>`;}).join('')}`).join('')}<p class="muted">“压轴题”表示该题型下的综合或推理层级。全册不含未在本书目录中列出的教学章节；原创题型仍可继续扩充。</p></div>`);}
function renderPaper(){const list=state.cart.map(id=>byId.get(id));showDialog('#paper',dialogHead('我的练习卷',`${list.length} 题 · 草稿保存在当前浏览器`)+`<div class="paper-settings"><label>练习卷标题<input id="paper-title" maxlength="80" value="${esc(state.title)}"></label><div class="paper-setting-row"><label>输出内容<select id="paper-mode"><option value="student" ${state.mode==='student'?'selected':''}>学生练习卷</option><option value="answers" ${state.mode==='answers'?'selected':''}>家长答案解析卷</option></select></label><label>作答留白<select id="paper-space">${[['compact','紧凑'],['normal','标准'],['large','宽松']].map(([v,t])=>`<option value="${v}" ${state.space===v?'selected':''}>${t}</option>`).join('')}</select></label><label class="inline-check"><input id="paper-examples" type="checkbox" ${state.examples?'checked':''}>附所选题型的例题讲解</label></div></div><div class="paper-toolbar"><button data-act="sort-paper" ${!list.length?'disabled':''}>按题目形式整理</button><span class="muted">${['基础题','提高题','压轴题'].map(d=>d+' '+list.filter(q=>q.difficulty===d).length).join(' · ')}</span></div><div class="paper-items">${list.length?list.map((q,i)=>`<div class="paper-item"><strong>${i+1}</strong><div><span class="muted">${q.difficulty} · ${q.type} · ${esc(byTopic.get(q.topicId).name)}</span><p>${esc(q.text)}</p></div><div class="order-buttons"><button data-act="up" data-id="${q.id}" aria-label="上移第 ${i+1} 题" ${i===0?'disabled':''}>↑</button><button data-act="down" data-id="${q.id}" aria-label="下移第 ${i+1} 题" ${i===list.length-1?'disabled':''}>↓</button><button data-act="remove" data-id="${q.id}" aria-label="移除第 ${i+1} 题">×</button></div></div>`).join(''):`<div class="empty"><h3>练习卷还是空的</h3><p>从题库勾选题目，可跨章节加入同一份练习卷。</p><button data-act="close">返回选题</button></div>`}</div><div class="dialog-actions paper-footer"><span class="muted">A4 排版 · 学生卷不含练习答案</span><button data-act="preview-paper" ${!list.length?'disabled':''}>排版预览</button><button class="primary" data-act="print" ${!list.length?'disabled':''}>打印 / 存为 PDF</button></div>`);}
function printHTML(){const list=state.cart.map(id=>byId.get(id)),answer=state.mode==='answers',title=(state.title.trim()||'数学练习卷')+(answer?' · 答案解析':'');const lessons=[...new Set(list.map(q=>q.topicId))].map(id=>byTopic.get(id));return `<div class="paper-document ${state.space}"><h1>${esc(title)}</h1><div class="print-meta">鲁教版五四制 · 七年级上册数学　共 ${list.length} 题</div>${answer?'':'<div class="student-line">姓名：________________　日期：________________</div>'}${state.examples?`<section class="printed-examples"><h2>例题讲解</h2>${lessons.map(t=>`<article class="print-example"><h3>${esc(t.name)}</h3><p>${esc(t.rule)}</p><p><strong>例题：</strong>${esc(t.example.text)}</p>${diagramHTML(t.example)}${optionsHTML(t.example)}${solutionHTML(t.example)}</article>`).join('')}</section><h2 class="exercise-start">${answer?'练习答案':'同类题练习'}</h2>`:''}${list.map((q,i)=>`<article class="print-question"><div class="print-q-title"><b>${i+1}.</b><span>${esc(q.text)}</span></div>${diagramHTML(q)}${optionsHTML(q)}${answer?solutionHTML(q):`<div class="answer-space ${['选择题','填空题'].includes(q.type)?'short':''}" aria-label="作答区域"></div>`}</article>`).join('')}<div class="print-end">— ${answer?'答案解析':'练习卷'}结束 —</div></div>`;}
function previewPaper(){if(!state.cart.length)return;showDialog('#detail',dialogHead('打印排版预览',state.mode==='answers'?'家长答案解析卷':'学生练习卷')+`<div class="preview-pages">${printHTML()}</div><div class="dialog-actions"><button class="primary" data-act="print">打印 / 存为 PDF</button></div>`);}
function doPrint(){if(!state.cart.length)return;$('#print-root').innerHTML=printHTML();document.body.classList.add('printing');requestAnimationFrame(()=>{try{window.print();}catch{toast('请使用浏览器的打印功能。');}});}
window.addEventListener('afterprint',()=>document.body.classList.remove('printing'));
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.pick){setPicked([el.dataset.pick],el.checked);return;}if(el.id==='type'){state.type=el.value;renderQuestions();}if(el.id==='scope'){state.scope=el.value;state.topic='all';render();}if(el.id==='section-select')navigate(el.value);if(el.id==='paper-mode')state.mode=el.value;if(el.id==='paper-space'){state.space=el.value;save();}if(el.id==='paper-examples')state.examples=el.checked;});
document.addEventListener('input',e=>{if(e.target.id==='paper-title'){state.title=e.target.value;save();}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const {act,id}=b.dataset;
if(act==='chapter')navigate(id+'.1');if(act==='section')navigate(id);
if(act==='topic'){state.topic=id;state.scope='section';render();}
if(act==='difficulty'){state.difficulty=id;render();}
if(act==='answer')showAnswer(id);if(act==='example')showExample(id);
if(act==='close')b.closest('dialog').close();if(act==='coverage')showCoverage();
if(act==='practice'||act==='coverage-topic'){b.closest('dialog').close();state.section=byTopic.get(id).section;state.topic=id;state.scope='section';state.difficulty='all';state.type='all';render();}
if(act==='select-visible'){const qs=filtered();setPicked(qs.map(q=>q.id),true);toast(qs.length?'已将当前 '+qs.length+' 道题加入练习卷':'当前没有可勾选的题目');}
if(act==='reset-filters'){state.topic='all';state.difficulty='all';state.type='all';render();}
if(act==='up'||act==='down'){const i=state.cart.indexOf(id),j=i+(act==='up'?-1:1);if(j>=0&&j<state.cart.length){[state.cart[i],state.cart[j]]=[state.cart[j],state.cart[i]];save();renderPaper();}}
if(act==='remove'){setPicked([id],false);renderPaper();}
if(act==='sort-paper'){const rank=['选择题','填空题','计算题','证明题','作图题','解答题'];state.cart.sort((a,b)=>rank.indexOf(byId.get(a).type)-rank.indexOf(byId.get(b).type));save();renderPaper();}
if(act==='preview-paper')previewPaper();if(act==='print')doPrint();});
$('#open-paper').addEventListener('click',renderPaper);
$('#detail').setAttribute('aria-label','题型讲解与预览');$('#paper').setAttribute('aria-label','我的练习卷');
render();
if(document.modelContext?.registerTool){const lifecycle=new AbortController();window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});const tools=[
{name:'list_math_questions',description:'读取当前筛选结果及已选题目编号。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute(input){if(input&&Object.keys(input).length)throw Error('不接受额外参数');return {questions:filtered().map(q=>({id:q.id,topic:byTopic.get(q.topicId).name,type:q.type,difficulty:q.difficulty,text:q.text})),selectedIds:[...state.cart]};}},
{name:'stage_math_paper_questions',description:'按题目编号批量加入或移出当前练习卷草稿，不打印。',inputSchema:{type:'object',properties:{ids:{type:'array',items:{type:'string'},minItems:1},selected:{type:'boolean'}},required:['ids','selected'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||!Array.isArray(input.ids)||!input.ids.length||typeof input.selected!=='boolean'||Object.keys(input).some(k=>!['ids','selected'].includes(k)))throw Error('参数无效');setPicked(input.ids,input.selected);if($('#paper').open)renderPaper();return {selectedIds:[...state.cart],count:state.cart.length};}}
];for(const tool of tools){try{Promise.resolve(document.modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{});}catch{}}}

</script></body></html>
